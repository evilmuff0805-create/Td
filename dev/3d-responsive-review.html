<!doctype html><html lang="ko"><meta charset="utf-8"><title>호국영웅전 · 휴대폰 크기 검수</title>
<style>body{margin:0;background:#102333;color:#dce6ed;font:13px sans-serif}header{padding:12px;background:#102333;z-index:2}button,select{padding:7px;background:#234558;color:inherit;border:1px solid #91a8b9;border-radius:4px}p{margin:7px 0}iframe{display:block;margin:0 auto 12px;border:1px solid #91a8b9;background:#102333}</style>
<header><label>기기 크기 <select id="size"><option value="414x896">세로 414×896</option><option value="360x800">좁은 세로 360×800</option><option value="896x414">가로 896×414</option></select></label> <button data-pad="right">패드 오른쪽</button> <button data-pad="up">패드 위</button> <button data-pad="release">패드 놓기</button> <button data-touch="grass">빈 땅 터치</button> <button data-touch="path">길 터치</button> <button data-touch="cancel">두 손가락 취소</button><p>실제 게임의 터치 조작 UI를 해당 크기의 프레임에 표시하고, 검수 버튼은 합성 터치 이벤트를 보냅니다. 물리 휴대폰·터치 장치·발열 검수는 아닙니다.</p></header>
<iframe id="game-frame" width="414" height="896" src="3d-device-review.html?mute=1&amp;touch=1" title="휴대폰 크기의 실제 게임"></iframe>
<script>document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split('x');const frame=document.getElementById('game-frame');frame.width=w;frame.height=h;};document.querySelectorAll('[data-touch]').forEach(b=>b.onclick=()=>document.getElementById('game-frame').contentWindow.postMessage({type:'review-touch-tap',kind:b.dataset.touch},location.origin));document.querySelectorAll('[data-pad]').forEach(b=>b.onclick=()=>document.getElementById('game-frame').contentWindow.postMessage({type:'review-pad',kind:b.dataset.pad},location.origin));</script></html>

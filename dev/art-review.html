<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>호국영웅전 · 새 그림 미리보기</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    body{overflow:auto;background:radial-gradient(ellipse at top,#203c50,#091723 70%);font-family:'Malgun Gothic',sans-serif}
    main{max-width:1200px;margin:auto;padding:32px 24px 80px}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:20px}
    h1{font-size:28px;font-weight:700;color:#f0cc8b}p{color:#b7c7d0;line-height:1.7}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}
    nav button[aria-pressed=true]{background:#315770;border-color:#f0cc8b}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}
    select{background:#173244;padding:10px;border:1px solid #628095;border-radius:8px;max-width:100%}
    #preview{width:100%;height:auto;display:block;border-radius:14px;border:1px solid #567083;box-shadow:0 16px 40px #0005}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.card{display:grid;justify-items:center;align-content:end;background:linear-gradient(145deg,#28445980,#0c1e2c);border:1px solid #405c6b;border-radius:12px;padding:12px;gap:8px}
    .card canvas{width:130px;height:130px;object-fit:contain}.card small{color:#a8becb}.tower-row{margin:24px 0}.tower-row h2{font:600 18px 'Malgun Gothic',sans-serif;margin-bottom:12px}
    #audit{padding:12px 16px;border:1px solid #4b7b71;background:#12332f;border-radius:10px;font-size:14px;line-height:1.65}#audit[data-state=fail]{background:#4b2323;border-color:#b76767}
    a{color:#e7c88a}section>p{margin-top:0}.legend{display:flex;gap:24px;flex-wrap:wrap;font-size:14px}.swatch{width:112px;height:112px;border-radius:6px}
    @media(max-width:600px){main{padding:20px 12px}h1{font-size:23px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card canvas{width:110px;height:110px}}
  </style>
</head>
<body><main>
  <header><h1>호국영웅전 · 새 그림 미리보기</h1><a href="../index.html">게임 실행 →</a></header>
  <p>부드러운 입체 캐릭터, 기와와 목재의 질감, 차가운 환경광과 따뜻한 등불을 하나의 화풍으로 맞췄습니다.</p>
  <div id="audit" role="status" data-state="loading">그림과 전장 25곳을 확인하고 있습니다…</div>
  <nav aria-label="미리보기 종류">
    <button class="btn" data-panel="battle" aria-pressed="true">전장</button>
    <button class="btn" data-panel="heroes" aria-pressed="false">영웅 · 의복</button>
    <button class="btn" data-panel="enemies" aria-pressed="false">왜군 · 적장</button>
    <button class="btn" data-panel="towers" aria-pressed="false">유산</button>
    <button class="btn" data-panel="props" aria-pressed="false">주변 오브제</button>
  </nav>
  <section id="battle"><div class="tools"><label>전장 <select id="stage"></select></label><label><input type="checkbox" id="bright"> 밝은 낮</label><button class="btn btn-small" id="save">전장 그림 저장</button><a id="download" hidden>PNG 내려받기</a></div><canvas id="preview"></canvas><p id="stage-note"></p></section>
  <section id="heroes" hidden><p>기본 의복과 두 의복 모두 같은 일러스트를 사용합니다.</p><div class="grid" id="hero-grid"></div></section>
  <section id="enemies" hidden><div class="grid" id="enemy-grid"></div></section>
  <section id="towers" hidden></section>
  <section id="props" hidden><div class="grid" id="prop-grid"></div></section>
</main>
<script type="module">
  import { preloadArt, artStatus, heroArt, propArt, drawIllustration } from '../src/render/art.js';
  import { HERO_ORDER, HEROES } from '../src/data/heroes.js';
  import { SKINS } from '../src/data/skins.js';
  import { ENEMIES } from '../src/data/enemies.js';
  import { TOWER_ORDER, TOWERS } from '../src/data/towers.js';
  import { STAGES } from '../src/data/stages.js';
  import { getMap } from '../src/sim/map.js';
  import { createGame, step, queueCommand } from '../src/sim/sim.js';
  import { createBot, botThink, botSkills } from '../src/sim/ai.js';
  import { heroFull, heroPortrait, enemyIcon } from '../src/ui/icons.js';
  import { towerIcon } from '../src/render/draw-towers.js';
  import { renderMapBackground } from '../src/render/draw-map.js';
  import { Renderer } from '../src/render/renderer.js';

  const $ = (id) => document.getElementById(id);
  await preloadArt();
  const art = artStatus();
  function card(image, title, sub = '') {
    const el = document.createElement('div'); el.className = 'card';
    const name = document.createElement('b'); name.textContent = title;
    const small = document.createElement('small'); small.textContent = sub;
    el.append(image, name, small); return el;
  }
  function image(url) { const img = new Image(); img.width = img.height = 130; img.src = url; return img; }
  for (const id of HERO_ORDER) for (const skin of [null, ...SKINS[id]]) {
    $('hero-grid').append(card(heroFull(id, 180, skin?.id), HEROES[id].name, skin?.name || '기본 의복'));
    heroPortrait(id, 70, 0, skin?.id);
  }
  for (const [id, def] of Object.entries(ENEMIES)) $('enemy-grid').append(card(image(enemyIcon(id, 130)), def.name, def.tier === 4 ? '적장' : '병력'));
  for (const id of TOWER_ORDER) {
    const row = document.createElement('div'); row.className = 'tower-row';
    const title = document.createElement('h2'); title.textContent = TOWERS[id].name;
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const [level, branch] of [[1,null],[2,null],[3,null],[3,'A'],[3,'B']]) grid.append(card(image(towerIcon(id,level,branch,130)), branch ? `${level}단계 · ${branch === 'A' ? '갑' : '을'} 특화` : `${level}단계`));
    row.append(title, grid); $('towers').append(row);
  }
  const propNames = {pine:'소나무',snowPine:'눈 덮인 소나무',maple:'단풍나무',bamboo:'대나무',rock:'이끼 바위',snowRock:'설산 바위',hanok:'기와집',thatch:'초가',supplies:'항아리와 보급 궤짝',jangseung:'장승',cliff:'바위 절벽',wall:'목책'};
  for (const [id, title] of Object.entries(propNames)) {
    const cv = document.createElement('canvas'); cv.width = cv.height = 260;
    drawIllustration(cv.getContext('2d'), propArt(id), 130, 248, 220);
    $('prop-grid').append(card(cv, title));
  }
  for (const st of STAGES) { const opt = document.createElement('option'); opt.value = st.id; opt.textContent = st.name; $('stage').append(opt); }
  const requested = new URLSearchParams(location.search).get('stage');
  $('stage').value = STAGES.some((s) => s.id === requested) ? requested : 's4';
  const renderer = new Renderer($('preview'));
  renderer.fx.shakeMode = 'off';
  function fixture(stageId, seconds = 65) {
    const game = createGame({stageId,difficulty:'normal',mode:'coop',seed:5,players:[{heroes:['yi'],skills:['singijeon','bongsu'],towers:TOWER_ORDER},{heroes:['gwak'],skills:['bigyeok','hanpa'],towers:TOWER_ORDER}]});
    const bots = game.players.map((_, i) => createBot(game,i,{}));
    while (game.time < seconds && !game.result) { for (const b of bots) { botThink(game,b,(c)=>queueCommand(game,c)); botSkills(game,b,(c)=>queueCommand(game,c)); } step(game); game.events.length = 0; }
    return game;
  }
  function showStage() {
    const id = $('stage').value, st = STAGES.find((s)=>s.id===id), game = fixture(id);
    renderer.setup(id,{mood:$('bright').checked?'bright':'cinema'});
    renderer.render(game,{clock:game.time,selHeroes:[0]},0);
    $('download').hidden = true;
    $('stage-note').textContent = `${st.name} · 기존 길 ${st.paths.length}갈래와 건설 위치에 새 재질·소품을 적용했습니다.`;
  }
  $('stage').addEventListener('change',showStage); $('bright').addEventListener('change',showStage);
  $('save').addEventListener('click',()=>{const a=$('download');a.download=`hoguk-${$('stage').value}-illustrated.png`;a.href=$('preview').toDataURL('image/png');a.hidden=false;});
  for (const button of document.querySelectorAll('nav button')) button.addEventListener('click',()=>{
    for (const other of document.querySelectorAll('nav button')) { const selected=other===button;other.setAttribute('aria-pressed',String(selected));$(other.dataset.panel).hidden=!selected; }
  });
  showStage();
  try {
    const expected={heroes:8,enemies:22,allies:6,towers:10,structures:2,props:12,terrain:8};
    for (const [group,count] of Object.entries(expected)) if(art[group]!==count) throw new Error(`${group}: ${art[group]}/${count}`);
    for (const id of HERO_ORDER) for(const sk of SKINS[id]) {
      const base=heroArt(id), variant=heroArt(id,sk.id);
      if(!variant) throw new Error(`의복 그림 누락: ${sk.id}`);
      const before=base.img.getContext('2d').getImageData(0,0,base.img.width,base.img.height).data;
      const after=variant.img.getContext('2d').getImageData(0,0,variant.img.width,variant.img.height).data;
      let changed=0;
      for(let i=0;i<before.length;i+=4) if(before[i+3]>80 && Math.abs(before[i]-after[i])+Math.abs(before[i+1]-after[i+1])+Math.abs(before[i+2]-after[i+2])>20) changed++;
      if(changed<100) throw new Error(`의복 색 적용 오류: ${sk.id}`);
    }
    const scratch = document.createElement('canvas'), smoke = new Renderer(scratch);
    for (const st of STAGES) {
      const bg=renderMapBackground(getMap(st.id),st,1);
      if(!bg.illustrated||bg.width!==960||bg.height!==560) throw new Error(`전장 그림 오류: ${st.id}`);
      const game=fixture(st.id,1); smoke.setup(st.id); smoke.render(game,{clock:1},0);
    }
    $('audit').dataset.state='pass';
    $('audit').textContent='확인 완료 · 영웅 8명 · 의복 16벌 · 왜군 22종 · 유산 10종(50개 단계·특화 표시) · 아군/이동체 6종 · 주변 소품 12종 · 전장 25곳';
  } catch(error) { $('audit').dataset.state='fail';$('audit').textContent=`확인 실패 · ${error.message}`;console.error(error); }
</script>
</body></html>

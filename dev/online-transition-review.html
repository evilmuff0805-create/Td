<!doctype html><html lang="ko"><meta charset="utf-8"><title>호국영웅전 · 온라인 2인 검수</title>
<style>body{margin:0;background:#102333;color:#dce6ed;font:13px sans-serif}header{padding:12px}button{min-height:32px;padding:6px;background:#234558;color:inherit;border:1px solid #91a8b9;border-radius:4px}main{display:flex;gap:12px;justify-content:center}section{width:414px}iframe{display:block;width:414px;height:800px;border:1px solid #91a8b9}h2{font-size:14px}</style>
<header>실제 서버에 방을 만들고 참가하는 두 독립 게임 화면입니다. 모바일 입력 버튼은 개발용 합성 터치를 보냅니다. 실폰·LTE 검수가 아닙니다.</header>
<main><section><h2>방장</h2><button data-frame="host" data-pad="right">방장 패드 오른쪽</button> <button data-frame="host" data-pad="release">방장 패드 놓기</button> <button data-frame="host" data-touch="grass">방장 빈 땅 터치</button><iframe id="host" title="방장 게임"></iframe></section><section><h2>참가자</h2><button data-frame="guest" data-pad="right">참가자 패드 오른쪽</button> <button data-frame="guest" data-pad="release">참가자 패드 놓기</button> <button data-frame="guest" data-touch="grass">참가자 빈 땅 터치</button><iframe id="guest" title="참가자 게임"></iframe></section></main>
<script>const remote=new URLSearchParams(location.search).has('remote');for(const frame of document.querySelectorAll('iframe'))frame.src=remote?'https://hoguk-game-production.up.railway.app/?mute=1':'3d-device-review.html?mute=1&touch=1';document.querySelectorAll('[data-frame]').forEach(button=>button.onclick=()=>{if(remote)return;document.getElementById(button.dataset.frame).contentWindow.postMessage({type:button.dataset.pad?'review-pad':'review-touch-tap',kind:button.dataset.pad||button.dataset.touch},location.origin);});if(remote)for(const button of document.querySelectorAll('button'))button.hidden=true;</script></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>호국영웅전 · 영웅 의상과 전장 포즈</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102033;color:#dae6ef;font:13px 'Malgun Gothic',sans-serif}header,main,footer{max-width:1220px;margin:auto}header{position:relative;z-index:2;padding:22px 20px 18px}h1{color:#ebd2a0;margin:0 0 8px;font-size:24px}header p{margin:0 0 16px;color:#abc0ce;line-height:1.6}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{display:flex;gap:7px;align-items:center;color:#c2d2df}select,button{font:inherit;border:1px solid #baa26970;background:#1b3348;color:#f1d9aa;padding:9px 10px;border-radius:6px;min-height:38px;max-width:100%}button{cursor:pointer}button[aria-pressed=true]{background:#365269}a{color:#eed5a3;text-decoration:none;white-space:nowrap}main{padding:0 20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}article{background:radial-gradient(ellipse at 50% 72%,#30465b,#192e43 75%);border:1px solid #90afc530;border-radius:10px;overflow:hidden;min-width:0}.viewport{height:270px}.info{position:relative;z-index:2;background:#162c3f;padding:12px 14px;min-height:82px}.info b{font-size:15px;color:#ead19d}.info p{margin:6px 0 0;font-size:11px;line-height:1.5;color:#b0c5d3}footer{padding:18px 20px;position:relative;z-index:2;color:#a5bdce;line-height:1.8}#pose-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}[hidden]{display:none!important}main[data-count="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}main[data-count="1"]{grid-template-columns:minmax(0,1fr);max-width:425px}main[data-count="1"] .viewport,main[data-count="3"] .viewport{height:350px}@media(max-width:700px){main,main[data-count="3"]{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 12px;gap:9px}.viewport,main[data-count="3"] .viewport{height:235px}.info{padding:10px;min-height:92px}header{padding:18px 12px}.controls{gap:10px}h1{font-size:21px}footer{padding:16px 12px}main[data-count="1"] .viewport{height:320px}}
</style></head><body>
<header><h1>영웅 의상과 전장 포즈</h1><p>기본 영웅 8명 · 특수 의상 16종 · 총 768자세<br>의상마다 네 방향 · 네 박자 걸음과 발사·타격 후·복귀를 같은 전장 시점에서 비교합니다.</p>
<div class="controls">
<label>영웅<select id="hero" aria-label="영웅"><option value="all">영웅 전체</option></select></label>
<label>의상<select id="wardrobe" aria-label="의상"><option value="alternate">특수 의상</option><option value="gold">금빛 전설</option><option value="base">기본 의상</option><option value="all">세 의상 비교</option></select></label>
<label>방향<select id="direction" aria-label="방향"><option value="0">오른쪽 앞</option><option value="1">오른쪽 뒤</option><option value="2">왼쪽 뒤</option><option value="3">왼쪽 앞</option><option value="cycle">차례로 전환</option></select></label>
<label>동작<select id="motion" aria-label="동작"><option value="idle">준비</option><option value="walk">이동</option><option value="attack">공격</option></select></label>
<label>걸음<select id="stride" aria-label="걸음"><option value="auto">발걸음 연결</option><option value="a">첫 디딤</option><option value="pa">첫 중간</option><option value="b">둘째 디딤</option><option value="pb">둘째 중간</option></select></label>
<label>공격 단계<select id="attack-phase" aria-label="공격 단계"><option value="auto">공격 연결</option><option value="release">발사·타격</option><option value="follow">공격 후</option><option value="recover">복귀</option></select></label>
<label>계절<select id="season" aria-label="계절"><option value="winter">겨울</option><option value="spring">봄</option><option value="summer">여름</option><option value="autumn">가을</option></select></label>
<button id="play" aria-pressed="false">동작 재생</button><a href="3d-hero-pose-review.html">기본 영웅 비교</a><a href="../3d.html?mute=1">전장으로 →</a>
</div></header>
<main id="pose-review"></main><footer><output id="status" aria-live="polite">그림을 불러오는 중…</output><br>이 화면은 의상 비교용이며, 재화와 능력치를 바꾸지 않습니다. 전투에서는 장착한 의상만 준비합니다. 소리는 없습니다.</footer>
<canvas id="pose-canvas" aria-label="영웅 의상의 방향별 전장 그림"></canvas><script type="module" src="../assets/3d/skin-pose-review.js"></script></body></html>

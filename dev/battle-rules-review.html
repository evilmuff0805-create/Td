<!doctype html>
<html lang="ko">
<head>

  <title>호국영웅전 · 출전 안내 검수</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>

  </style>
</head>
<body>
  <main>
    <h2>출전 안내 검수</h2>

    <div id="controls" class="row"></div>
    <section id="preview" class="panel stack"></section>
  </main>
  <script type="module" src="../src/ui/battle-rules-review.js"></script>

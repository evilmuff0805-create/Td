<!doctype html><html lang="ko"><meta charset="utf-8"><title>타일 모바일 조작 검수</title><style>body{margin:0;background:#102333;color:#e3e7dc;font:13px sans-serif}header{padding:8px;display:flex;gap:6px;flex-wrap:wrap}button,select{min-height:36px;background:#234352;color:inherit;border:1px solid #91a8a1;border-radius:4px}iframe{display:block;border:1px solid #728f90;margin:0 auto;width:414px;height:896px;transform-origin:top center}</style><header><select id="size" aria-label="화면 크기"><option>414x896</option><option>360x800</option><option>896x414</option><option>1280x720</option></select><select id="stage" aria-label="검수 전장"><option value="s1">부산진</option><option value="s4">행주대첩</option><option value="s19">울산성</option><option value="s25">노량</option></select><select id="hero" aria-label="검수 영웅"><option value="gang">강감찬</option><option value="gwon">권율</option><option value="yi">이순신</option></select><button data-action="start">전투 시작</button><button data-action="drag" data-kind="valid">빈칸 드래그</button><button data-action="drag" data-kind="occupied">점유칸 드래그</button><button data-action="drag" data-kind="cancel">드래그 취소</button><button data-action="drag" data-kind="multitouch">두 손가락 취소</button><button data-action="camera">전장 핀치</button><button data-action="enemy">공격 표적</button><button data-action="death">사망 예약 확인</button><span>실제 CSS 크기 · 합성 터치 검사 · 실폰 검수 아님</span></header><iframe id="review" title="타일 게임" src="tile-review.html?mute=1"></iframe><output id='metrics' hidden></output><output id='result' hidden></output><script>window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='tile-metrics')document.getElementById('metrics').textContent=JSON.stringify(e.data.data);if(e.data?.type==='tile-result')document.getElementById('result').textContent=JSON.stringify(e.data.data);});const frame=document.getElementById('review');function size(){const [w,h]=document.getElementById('size').value.split('x').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`scale(${Math.min(1,(innerWidth-8)/w,(innerHeight-document.querySelector('header').offsetHeight-8)/h)})`;}document.getElementById('size').onchange=size;window.addEventListener('resize',size);size();for(const b of document.querySelectorAll('button'))b.onclick=()=>frame.contentWindow.postMessage({type:'tile-review',action:b.dataset.action,kind:b.dataset.kind,hero:document.getElementById('hero').value,stageId:document.getElementById('stage').value},location.origin);</script></html>

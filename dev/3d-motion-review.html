<header><h1>캐릭터 동작 전환</h1><p>발걸음이 멈추고, 공격하고, 다시 움직이는 순간을 같은 전장 원화로 확인합니다.<br>이순신·세종·수비병·왜군·기병·거북선을 함께 비교합니다.</p>
<div class="controls"><label>전환 장면<select id="scenario" aria-label="전환 장면"></select></label><label>계절<select id="season" aria-label="계절"><option value="winter">겨울</option><option value="spring">봄</option><option value="summer">여름</option><option value="autumn">가을</option></select></label><button id="play" aria-pressed="false">동작 재생</button><button id="restart">처음부터</button><span class="time" id="time">0.00 / 4.80초</span><a href="3d-combat-pose-review.html?mute=1">병력 원화 →</a></div>
<div id="stops" class="stops" aria-label="주요 순간"></div><output id="status" aria-live="polite">원화를 준비하고 있습니다…</output></header>
<main id="actors"></main><footer>일반 왜군은 진군하다 성문에 닿으면 기존 규칙대로 사라집니다. 이 화면의 공격은 길막 교전·사격의 표시를 검토하는 장면이며, 거북선은 이동과 대기 자세만 사용합니다. 실제 전장 좌표·피해·공격 간격·로컬 2인 조작은 바꾸지 않습니다. 이 화면에는 소리와 전투 보상이 없습니다.</footer>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>호국영웅전 · 병력과 적장의 전장 포즈</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102033;color:#dae6ef;font:13px 'Malgun Gothic',sans-serif}header,main,footer{max-width:1220px;margin:auto}header{position:relative;z-index:2;padding:22px 20px 18px}h1{color:#ebd2a0;margin:0 0 8px;font-size:24px}header p{margin:0 0 16px;color:#abc0ce;line-height:1.6}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{display:flex;gap:7px;align-items:center;color:#c2d2df}select,button{font:inherit;border:1px solid #baa26970;background:#1b3348;color:#f1d9aa;padding:9px 10px;border-radius:6px;min-height:38px;max-width:100%}button{cursor:pointer}button[aria-pressed=true]{background:#365269}a{color:#eed5a3;text-decoration:none;white-space:nowrap}main{padding:0 20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}article{background:radial-gradient(ellipse at 50% 72%,#30465b,#192e43 75%);border:1px solid #90afc530;border-radius:10px;overflow:hidden;min-width:0}.viewport{height:270px}.info{position:relative;z-index:2;background:#162c3f;padding:12px 14px;min-height:72px}.info b{font-size:15px;color:#ead19d}.info p{margin:6px 0 0;font-size:11px;line-height:1.5;color:#b0c5d3}footer{padding:18px 20px;position:relative;z-index:2;color:#a5bdce;line-height:1.8}#pose-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}[hidden]{display:none!important}main[data-focus="single"]{grid-template-columns:minmax(0,1fr);max-width:425px}main[data-focus="single"] .viewport{height:350px}@media(max-width:700px){main{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 12px;gap:9px}.viewport{height:235px}.info{padding:10px;min-height:88px}header{padding:18px 12px}.controls{gap:10px}h1{font-size:21px}footer{padding:16px 12px}main[data-focus="single"] .viewport{height:320px}}
</style></head><body>
<header><h1>병력과 적장의 전장 포즈</h1><p>일반 왜군 10종 · 적장 12명 · 아군과 이동 병기 6종 · 총 896자세<br>각각 네 방향 · 네 박자 이동과 타격·공격 후·복귀를 같은 전장 시점에서 비교합니다.</p>
<div class="controls">
<label>병력<select id="group" aria-label="병력"><option value="troops">일반 왜군 10종</option><option value="boss-a">적장 1–6</option><option value="boss-b">적장 7–12</option><option value="allies">아군·이동 병기 6종</option></select></label>
<label>표시<select id="actor" aria-label="표시"><option value="all">이 병력 전체</option></select></label>
<label>방향<select id="direction" aria-label="방향"><option value="0">오른쪽 앞</option><option value="1">오른쪽 뒤</option><option value="2">왼쪽 뒤</option><option value="3">왼쪽 앞</option><option value="cycle">차례로 전환</option></select></label>
<label>동작<select id="motion" aria-label="동작"><option value="idle">준비</option><option value="walk">이동</option><option value="attack">공격·전투 준비</option></select></label>
<label>걸음<select id="stride" aria-label="걸음"><option value="auto">발걸음 연결</option><option value="a">첫 디딤</option><option value="pa">첫 중간</option><option value="b">둘째 디딤</option><option value="pb">둘째 중간</option></select></label>
<label>공격 단계<select id="attack-phase" aria-label="공격 단계"><option value="auto">공격 연결</option><option value="release">발사·타격</option><option value="follow">공격 후</option><option value="recover">복귀</option></select></label>
<label>계절<select id="season" aria-label="계절"><option value="winter">겨울</option><option value="spring">봄</option><option value="summer">여름</option><option value="autumn">가을</option></select></label>
<button id="play" aria-pressed="false">동작 재생</button><a href="3d-hero-pose-review.html?mute=1">영웅 비교</a><a href="../3d.html?mute=1">전장으로 →</a>
</div></header>
<main id="pose-review"></main><footer><output id="status" aria-live="polite">그림을 불러오는 중…</output><br>전장 이동은 디딤과 중간 자세를 네 박자로 연결합니다. 전령과 거북선의 공격·복귀는 검토용 긴급 행군·전투 준비 원화이며, 실제 전투에는 이동 자세만 사용합니다. 이 화면에는 소리가 없습니다.</footer>
<canvas id="pose-canvas" aria-label="병력과 적장의 방향별 전장 그림"></canvas><script type="module" src="../assets/3d/combat-pose-review.js"></script></body></html>

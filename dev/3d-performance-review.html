<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>호국영웅전 · 밀집 전투 성능 비교</title>
<style>body{margin:0;background:#102333;color:#e2e9e8;font:14px 'Malgun Gothic',sans-serif}canvas{position:absolute;width:100%;height:100%;inset:0;display:block}header{position:absolute;top:12px;left:12px;padding:14px 18px;border:1px solid #a8bfcc44;border-radius:10px;background:#0b2132ee;max-width:calc(100% - 60px)}h1{font-size:17px;margin:0 0 10px}label{display:inline-block;margin:0 12px 8px 0}select,button{font:inherit;background:#263e4d;color:#e8eee9;border:1px solid #9fb6c855;border-radius:4px;padding:5px}p{font-size:12px;margin:7px 0;color:#b2c4cc}output{font:700 14px 'Malgun Gothic',sans-serif;color:#f1d69e;display:block;margin-top:8px}</style>
<canvas id="review" aria-label="실제 전투 모델로 구성한 밀집 병력 비교 전장"></canvas>
<header><h1>밀집 전투 성능 비교</h1>
<label>병력 <select id="count"><option>32</option><option selected>64</option><option>128</option></select></label>
<label>표현 <select id="art"><option value="fixed">고정 시점 그림</option><option value="mesh">입체 모델</option></select></label>
<label>그리기 <select id="batch"><option value="on">병력 묶기</option><option value="off">개별 그리기</option></select></label>
<label>품질 <select id="quality"><option value="high">높음</option><option value="low">가벼움</option></select></label>
<button id="restart">다시 구성</button><p>같은 카메라·모델·조명으로 비교합니다. 성능 점검용 장면이며 캠페인 저장·보상에는 반영하지 않습니다.</p><output id="metrics" aria-live="polite">전장 구성 중…</output></header>
<script type="module" src="../assets/3d/performance-review.js"></script></html>

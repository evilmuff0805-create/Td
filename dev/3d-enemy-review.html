<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>호국영웅전 · 적 병과와 적장</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#132334;color:#dae6ef;font:12px 'Malgun Gothic',sans-serif}header,main,footer{max-width:1220px;margin:auto}header{padding:22px 20px 16px}h1{color:#ebd2a0;margin:0 0 7px;font-size:24px}header p{margin:0 0 16px;color:#abc0ce}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{display:flex;gap:7px;align-items:center;color:#aebfcc}select,button{font:inherit;border:1px solid #baa26970;background:#1b3348;color:#f1d9aa;padding:8px 10px;border-radius:5px}button{cursor:pointer}button[aria-pressed=true]{background:#365269}input[type=range]{width:110px;accent-color:#d1b580}a{color:#eed5a3;text-decoration:none;white-space:nowrap}main{padding:0 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}article{background:#20374b;border:1px solid #90afc530;border-radius:10px;overflow:hidden}.viewport{height:235px}.info{position:relative;z-index:2;background:#162e40;padding:11px 14px;min-height:72px}.info b{font-size:14px;color:#ead19d}.info p{margin:5px 0 0;font-size:10px;color:#b0c5d3;line-height:1.6}footer{padding:16px 20px;position:relative;z-index:2;color:#9bb3c2;line-height:1.7}#enemy-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}[hidden]{display:none!important}@media(max-width:700px){main{grid-template-columns:repeat(2,1fr)}.viewport{height:235px}.controls{gap:9px}h1{font-size:21px}}
</style></head><body>
<header><h1>병과와 적장의 모습</h1><p>일반 병력 10종 · 적장 12명 · 실제 전투 모델과 관절 동작</p>
<div class="controls"><label>분류<select id="group" aria-label="분류"><option value="boss">적장 12명</option><option value="enemy">일반 병력 10종</option><option value="all">전체 22종</option></select></label><label>확대<select id="focus" aria-label="확대"><option value="body">전신</option><option value="face">얼굴</option></select></label><label>방향<select id="angle" aria-label="방향"><option value="quarter">비스듬히</option><option value="front">정면</option><option value="back">뒷모습</option><option value="turn">회전</option></select></label><label>표현<select id="appearance" aria-label="표현"><option value="surface">재질</option><option value="silhouette">실루엣</option></select></label><label>동작<select id="motion" aria-label="동작"><option value="idle">준비</option><option value="walk">걷기</option><option value="attack">공격</option></select></label><button id="play" aria-pressed="false">동작 재생</button><label id="scrub-label" hidden>공격 진행<input id="scrub" aria-label="공격 진행" type="range" min="0" max="100" value="0"><output id="progress">0%</output></label><a href="../3d.html?mute=1">전장으로 →</a></div></header>
<main id="enemy-review"></main><footer><output id="status" aria-live="polite"></output><br>같은 병력과 적장 분류에서는 같은 카메라 크기로 비교합니다. 게임용으로 재해석한 외형이며 고증 복원 자료는 아닙니다. 이 화면에는 소리가 없습니다.</footer><canvas id="enemy-canvas" aria-label="적 병력 22종의 외형과 동작"></canvas><script type="module" src="../assets/3d/enemy-review.js"></script></body></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>호국영웅전 · 영웅의 전장 포즈</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102033;color:#dae6ef;font:13px 'Malgun Gothic',sans-serif}header,main,footer{max-width:1220px;margin:auto}header{position:relative;z-index:2;padding:22px 20px 18px}h1{color:#ebd2a0;margin:0 0 8px;font-size:24px}header p{margin:0 0 16px;color:#abc0ce;line-height:1.6}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{display:flex;gap:7px;align-items:center;color:#c2d2df}select,button{font:inherit;border:1px solid #baa26970;background:#1b3348;color:#f1d9aa;padding:9px 10px;border-radius:6px;min-height:38px}button{cursor:pointer}button[aria-pressed=true]{background:#365269}a{color:#eed5a3;text-decoration:none;white-space:nowrap}main{padding:0 20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}article{background:radial-gradient(ellipse at 50% 72%,#30465b,#192e43 75%);border:1px solid #90afc530;border-radius:10px;overflow:hidden;min-width:0}.viewport{height:270px}.info{position:relative;z-index:2;background:#162c3f;padding:12px 14px;min-height:70px}.info b{font-size:15px;color:#ead19d}.info p{margin:6px 0 0;font-size:11px;line-height:1.5;color:#b0c5d3}footer{padding:18px 20px;position:relative;z-index:2;color:#a5bdce;line-height:1.8}#pose-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}[hidden]{display:none!important}@media(max-width:700px){main{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 12px;gap:9px}.viewport{height:235px}.info{padding:10px;min-height:80px}header{padding:18px 12px}.controls{gap:10px}h1{font-size:21px}footer{padding:16px 12px}}
</style></head><body>
<header><h1>영웅의 전장 포즈</h1><p>기본 의복 8명 · 네 방향 · 준비, 걷기 두 자세, 공격 · 실제 전장의 고정 시점</p>
<div class="controls">
<label>방향<select id="direction" aria-label="방향"><option value="0">오른쪽 앞</option><option value="1">오른쪽 뒤</option><option value="2">왼쪽 뒤</option><option value="3">왼쪽 앞</option><option value="cycle">차례로 전환</option></select></label>
<label>동작<select id="motion" aria-label="동작"><option value="idle">준비</option><option value="walk">걷기</option><option value="attack">공격</option></select></label>
<label>걸음<select id="stride" aria-label="걸음"><option value="auto">두 자세 교대</option><option value="a">첫 자세</option><option value="b">둘째 자세</option></select></label>
<label>계절<select id="season" aria-label="계절"><option value="winter">겨울</option><option value="spring">봄</option><option value="summer">여름</option><option value="autumn">가을</option></select></label>
<button id="play" aria-pressed="false">동작 재생</button><a href="../3d.html?mute=1">전장으로 →</a>
</div></header>
<main id="pose-review"></main><footer><output id="status" aria-live="polite">그림을 불러오는 중…</output><br>걷기는 두 자세를 교대하는 방식입니다. 특별 의복과 적군의 방향별 포즈는 다음 작업 범위입니다. 이 화면에는 소리가 없습니다.</footer>
<canvas id="pose-canvas" aria-label="영웅 8명의 방향별 전장 그림"></canvas><script type="module" src="../assets/3d/hero-pose-review.js"></script></body></html>

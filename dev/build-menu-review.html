<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>호국영웅전 · 건설 메뉴 검수</title><link rel="stylesheet" href="../styles/main.css">
<style>body{margin:0;background:#182d32}header{padding:12px;color:#f2dfb8}header h1{font-size:18px;margin:0 0 8px}header label{display:inline-flex;gap:5px;margin:4px}#review{position:relative;width:100vw;height:calc(100dvh - 154px);min-height:130px;background:radial-gradient(ellipse,#486044,#1d3330)}#anchor{position:absolute;width:24px;height:24px;margin:-12px;border:2px solid #e6d8ac;border-radius:50%;pointer-events:none}#review .overlay{position:absolute;inset:0}#status{font-size:12px}select,button{font:inherit}</style>
<header><h1>건설 메뉴 검수</h1><label>건물 수<select id="count" aria-label="건물 수"><option>3</option><option>8</option><option selected>10</option></select></label><label>위치<select id="position" aria-label="위치"><option value="center">가운데</option><option value="edge">모서리</option></select></label><label>검수 영역<select id="size" aria-label="검수 영역"><option value="0x0">현재 화면</option><option value="414x742">세로 414 × 742</option><option value="896x260">가로 896 × 260</option><option value="320x180">작은 영역 320 × 180</option></select></label><label><input id="keyboard" type="checkbox">2P 키보드 고리</label><button id="next">다음 건물</button><p id="status" role="status"></p></header><main id="review"><span id="anchor"></span><div class="overlay"></div></main><script type="module" src="../assets/3d/build-menu-review.js"></script></html>

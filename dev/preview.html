<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>미리보기</title>
<style>body{margin:0;background:#222}canvas{display:block;width:960px;height:560px}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { createGame, step, queueCommand } from '../src/sim/sim.js';
import { createBot, botThink, botSkills } from '../src/sim/ai.js';
import { Renderer } from '../src/render/renderer.js';
import { TOWERS } from '../src/data/towers.js';
import { preloadArt } from '../src/render/art.js';
const q = new URLSearchParams(location.search);
const stageId = q.get('s') || 's1';
const secs = +(q.get('t') || 60);
const all = Object.keys(TOWERS);
const s = createGame({ stageId, difficulty: 'normal', mode: q.get('m') || 'solo', seed: 5, players: q.get('m')==='coop' ? [{heroes:['yi'],skills:['singijeon','bongsu'],towers:all},{heroes:['sejong'],skills:['bigyeok','hanpa'],towers:all}] : [{ heroes: (q.get('h')||'yi,sejong').split(','), skills: ['singijeon', 'bongsu'], towers: all }] });
const bots = s.players.map((_, i) => createBot(s, i, {}));
const send = (c) => queueCommand(s, c);
const r = new Renderer(document.getElementById('c'));
await Promise.all([document.fonts.ready, preloadArt()]);
r.setup(stageId);
while (s.time < secs && !s.result) { for (const b of bots) { botThink(s, b, send); botSkills(s, b, send); } step(s); if (s.time > secs - 1.2) { r.events(s.events); r.render(s, { clock: s.time }, 1/60); } s.events.length = 0; }
r.render(s, { clock: s.time, selTower: s.towers[2]?.id, selHeroes:[0] }, 1/60);
window.done = true;
</script></body></html>

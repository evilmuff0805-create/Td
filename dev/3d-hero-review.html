<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>호국영웅전 · 영웅 조형과 동작</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#132334;color:#dae6ef;font:12px 'Malgun Gothic',sans-serif}header,main,footer{max-width:1220px;margin:auto}header{padding:22px 20px 16px}h1{color:#ebd2a0;margin:0 0 7px;font-size:24px}header p{margin:0 0 16px;color:#abc0ce}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{display:flex;gap:7px;align-items:center;color:#aebfcc}select,button{font:inherit;border:1px solid #baa26970;background:#1b3348;color:#f1d9aa;padding:8px 10px;border-radius:5px}button{cursor:pointer}button[aria-pressed=true]{background:#365269}input[type=range]{width:125px;accent-color:#d1b580}a{color:#eed5a3;text-decoration:none;margin-left:auto;white-space:nowrap}main{padding:0 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}article{background:#20374b;border:1px solid #90afc530;border-radius:10px;overflow:hidden}.viewport{height:215px}.info{position:relative;z-index:2;background:#162e40;padding:11px 14px;min-height:68px}.info b{font-size:14px;color:#ead19d}.info p{margin:5px 0 0;font-size:10px;color:#b0c5d3}footer{padding:16px 20px;position:relative;z-index:2;color:#9bb3c2;line-height:1.7}#hero-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}[hidden]{display:none!important}@media(max-width:700px){main{grid-template-columns:repeat(2,1fr)}.viewport{height:220px}.controls{gap:10px}a{margin-left:0}h1{font-size:21px}}
</style></head><body>
<header><h1>영웅의 얼굴과 움직임</h1><p>실제 전투 모델 8명 · 피부·머리결·직물·가죽·갑주 · 의복과 조명 비교</p>
<div class="controls"><label>확대<select id="focus" aria-label="확대"><option value="body">전신</option><option value="face">얼굴</option></select></label><label>방향<select id="angle" aria-label="방향"><option value="quarter">비스듬히</option><option value="front">정면</option><option value="back">뒷모습</option><option value="turn">회전</option></select></label><label>동작<select id="motion" aria-label="동작"><option value="idle">준비</option><option value="walk">걷기</option><option value="attack">공격</option></select></label><label>의복<select id="outfit" aria-label="의복"><option value="base">기본</option><option value="variant">특별 의복</option><option value="gold">황금 의복</option></select></label><label>조명<select id="lighting" aria-label="조명"><option value="neutral">기본</option><option value="warm">따뜻한 빛</option><option value="cool">차가운 빛</option></select></label><button id="play" aria-pressed="false">동작 재생</button><label id="scrub-label" hidden>공격 진행<input id="scrub" type="range" min="0" max="100" value="0"><output id="progress">0%</output></label><a href="../3d.html?mute=1">전장으로 →</a></div></header>
<main id="hero-review"></main><footer><output id="status" aria-live="polite"></output><br>전투 수치와 판정은 기존 시뮬레이션을 따릅니다. 이 화면에는 소리가 없습니다.</footer><canvas id="hero-canvas" aria-label="영웅 8명의 얼굴과 관절 동작"></canvas><script type="module" src="../assets/3d/hero-review.js"></script></body></html>
